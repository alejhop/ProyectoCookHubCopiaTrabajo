name: Hacia rama develop

on:
  push:
    branches:
      - 'feature/**'

jobs:
  merge-feature-to-develop:
    name: Merge feature a develop
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'terminado')
    permissions:
      contents: write
    
    steps:
      - name: Checkout de repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} 
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Confirmar palabra clave detectada
        run: |
          echo "Palabra clave 'terminado' detectada"
          echo "Rama actual: ${{ github.ref_name }}"
      
      - name: Actualizar feature con develop
        run: |
          git fetch origin develop
          git checkout ${{ github.ref_name }}
          git merge origin/develop --no-edit || {
            echo "Conflicto al mergear develop en la feature"
            exit 1
          }
      
      - name: Configuración de entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Instalación de librerías y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Correr pruebas
        id: correr-pruebas
        working-directory: ./backend
        run: |
          python -m unittest discover -s tests -p "test_vista.py" -v
      
      - name: Cálculo de cubrimiento
        id: cubrimiento
        working-directory: ./backend
        run: |
          pip install coverage
          coverage run -m unittest discover -s tests -p "test_vista.py"
          coverage report -m
      
      - name: Merge feature a develop
        if: success()
        run: |
          git checkout develop
          git merge ${{ github.ref_name }} --no-ff -m "Merge ${{ github.ref_name }} en develop"
          git push origin develop
          echo "Feature merge exitosamente a develop"
      
      - name: Notificar fallo
        if: failure()
        run: |
          echo "Falló el pipeline. No se hace merge a develop."
          exit 1
